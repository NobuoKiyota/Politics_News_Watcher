name: Politics News Watcher Scheduler

on:
  schedule:
    # 毎時0分に実行
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scheduler Logic (Force Delivery Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          
          # Create service_account.json from Secret
          echo '${{ secrets.GCP_SA_JSON }}' > service_account.json
          
          # Create cookies.txt for yt-dlp
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo '${{ secrets.YOUTUBE_COOKIES }}' > cookies.txt
          fi
          
          # Run the delivery script directly (stateless run)
          # We use a modified "force_delivery"-like logic or just call scheduler tasks once?
          # scheduler.py with a flag? 
          # Let's create a dedicated "cloud_run.py" or use "python scheduler.py" is for loop.
          # We need a script that runs ONCE then exits.
          # Let's effectively use "python force_delivery.py" if we restored it, OR create "cloud_entrypoint.py".
          # Since force_delivery.py is ignored/temp, let's create a stable entrypoint: "cloud_run.py"
          
          python cloud_run.py
